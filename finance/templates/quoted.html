{% extends "layout.html" %}

{% block title %}
    Quoted
{% endblock %}

{% block main %}
    <h3>Quoted</h3>
    <hr>
    <form action="/quote" method="post">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Symbol</th>
                </tr>
            </thead>
            <tbody>
                {% if quote %}
                <tr>
                    <td>{{ quote.name }}</td>
                    <td>{{ quote.price }}</td>
                    <td>{{ quote.symbol }}</td>
                </tr>
                {% else %}
                <tr>
                    <td>No data found</td>
                    <td>No data found</td>
                    <td>No data found</td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </form>
{% endblock %}

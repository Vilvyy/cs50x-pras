<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <title>Trivia!</title>
    <script defer src="script.js"></script>
</head>
<body>
    <div class="header">
        <h1>Trivia!</h1>
    </div>

    <div class="container">
        <!-- Multiple Choice Section -->
        <div class="section">
            <h2>Part 1: Multiple Choice</h2>
            <hr>
            <h3>What is the capital of France?</h3>
            <button class="choice" data-correct="false">Berlin</button>
            <button class="choice" data-correct="true">Paris</button>
            <button class="choice" data-correct="false">Rome</button>
            <p id="multiple-choice-result"></p>
        </div>

        <!-- Free Response Section -->
        <div class="section">
            <h2>Part 2: Free Response</h2>
            <hr>
            <h3>What is the square root of 64?</h3>
            <input type="text" id="response-input">
            <button id="submit-response">Submit</button>
            <p id="free-response-result"></p>
        </div>
    </div>
</body>
</html>
